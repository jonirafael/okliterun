# Copy this file to .github/workflows/ci.yml when the repository token
# has the workflow scope. It is kept under docs/ so packaging this repo
# does not require that permission.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tools used by tests
        run: sudo apt-get update && sudo apt-get install -y gcc python3 xvfb zsh

      - name: Install VS Code runtime libraries
        run: |
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 \
            libgtk-3-0 libx11-xcb1 libxcb-dri3-0

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx @vscode/vsce package
      - run: xvfb-run -a npm run test:integration
